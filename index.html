<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicola Canale</title>
<meta name="description" content="Nicola Canale — Post-doc Researcher, University of Ferrara / INFN Ferrara.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBF9;
    --card:#FFFFFF;
    --ink:#1A1D21;
    --muted:#5C6470;
    --rule:#E4E7EA;
    --beam:#0F8B8D;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#121417; --card:#1B1E22; --ink:#EEF0F1; --muted:#9BA3AC; --rule:#2C3035; --beam:#3FC1C3; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:clamp(1rem, 5vw, 3rem) 1rem;
  }
  a{ color:inherit; text-decoration:none; }
  a:focus-visible{ outline:2px solid var(--beam); outline-offset:3px; border-radius:2px; }

  .card{
    width:100%;
    max-width:25rem;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:4px;
    overflow:hidden;
  }

  .portrait{
    display:block;
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    object-position:center 30%;
  }

  .identity{
    padding:1.4rem 1.5rem 1.25rem;
    border-bottom:2px solid var(--beam);
  }
  h1{
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0 0 0.35rem;
  }
  .role{ margin:0; font-weight:500; }
  .org{ margin:0.15rem 0 0; color:var(--muted); font-size:0.95rem; }

  .fields{ padding:0.4rem 1.5rem 0.5rem; }
  .field{
    display:flex;
    gap:0.9rem;
    align-items:flex-start;
    padding:0.85rem 0;
    border-bottom:1px solid var(--rule);
  }
  .field:last-child{ border-bottom:0; }
  .field svg{
    width:18px; height:18px; flex:none;
    margin-top:0.15rem;
    stroke:var(--beam);
    fill:none; stroke-width:1.8;
    stroke-linecap:round; stroke-linejoin="round";
  }
  .field .label{ display:block; font-size:0.78rem; color:var(--muted); margin-top:0.1rem; }
  .field a{ text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:3px; }
  .field a:hover{ text-decoration-color:var(--beam); }
  address{ font-style:normal; }
  address a{ display:inline-block; }

  .actions{ padding:0.25rem 1.5rem 1.5rem; }
  .save{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.55rem;
    padding:0.8rem 1rem;
    background:var(--beam);
    color:#fff;
    border-radius:3px;
    font-weight:500;
  }
  @media (prefers-color-scheme: dark){ .save{ color:#0E2427; } }
  .save svg{ width:17px; height:17px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<main class="card">

  <img class="portrait" src="foto.jpg" alt="Nicola Canale">

  <div class="identity">
    <h1>Nicola Canale</h1>
    <p class="role">Post-doc Researcher</p>
    <p class="org">University of Ferrara &middot; INFN Ferrara</p>
  </div>

  <div class="fields">

    <div class="field">
      <svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      <div>
        <a href="tel:+393298726201">+39 329 872 6201</a>
        <span class="label">Mobile</span>
      </div>
    </div>

    <div class="field">
      <svg viewBox="0 0 24 24" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
      <div>
        <a href="mailto:ncanale@fe.infn.it">ncanale@fe.infn.it</a>
        <span class="label">Email</span>
      </div>
    </div>

    <div class="field">
      <svg viewBox="0 0 24 24" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 10v7M7 7v.01M12 17v-4a2 2 0 0 1 4 0v4"/></svg>
      <div>
        <a href="https://www.linkedin.com/in/nicola-canale/">nicola-canale</a>
        <span class="label">LinkedIn</span>
      </div>
    </div>

    <div class="field">
      <svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <div>
        <address><a href="https://www.google.com/maps/search/?api=1&amp;query=Via%20Saragat%201%2C%2044121%20Ferrara%2C%20Italy" target="_blank" rel="noopener">Via Saragat 1<br>44121 Ferrara, Italy</a></address>
        <span class="label">Address</span>
      </div>
    </div>

  </div>

  <div class="actions">
    <a class="save" href="contact.vcf" download>
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      Save contact
    </a>
  </div>

</main>
</body>
</html>
